<!DOCTYPE html>
<html>
<head>
    <title>Check LocalStorage - Enhanced</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        pre { background: #f4f4f4; padding: 15px; border-radius: 5px; overflow-x: auto; }
        button { 
            padding: 10px 20px; 
            margin: 5px; 
            cursor: pointer; 
            border: none; 
            border-radius: 5px;
            font-weight: bold;
        }
        .remove-btn { background: #ff9800; color: white; }
        .clear-btn { background: #f44336; color: white; }
        .warning { color: #d32f2f; font-weight: bold; }
        .success { color: #388e3c; font-weight: bold; }
        .info { 
            margin: 20px 0; 
            padding: 15px; 
            background: #e3f2fd; 
            border-left: 4px solid #2196F3;
            border-radius: 5px; 
        }
        h1 { color: #1976d2; }
        .module-breakdown {
            margin: 20px 0;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
        }
        .module-item {
            margin: 5px 0;
            padding: 8px;
            background: white;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <h1>📊 LocalStorage Completed Lessons</h1>
    
    <div id="stats" class="info"></div>
    
    <div id="moduleBreakdown" class="module-breakdown"></div>
    
    <h3>Raw Data:</h3>
    <pre id="output"></pre>
    
    <button class="remove-btn" onclick="removeDuplicates()">🔧 Remove Duplicates</button>
    <button class="clear-btn" onclick="clearStorage()">🗑️ Clear All</button>
    
    <script>
        function displayData() {
            const completed = localStorage.getItem('completedLessons');
            const parsedData = completed ? JSON.parse(completed) : [];
            
            // Display raw data
            document.getElementById('output').textContent = JSON.stringify(parsedData, null, 2) || 'No completed lessons';
            
            // Calculate overall stats
            const total = parsedData.length;
            const unique = new Set(parsedData).size;
            const duplicates = total - unique;
            
            // Module breakdown
            const moduleCount = {
                reading: parsedData.filter(l => l.startsWith('reading-')).length,
                listening: parsedData.filter(l => l.startsWith('listening-')).length,
                writing: parsedData.filter(l => l.startsWith('writing-')).length,
                speaking: parsedData.filter(l => l.startsWith('speaking-')).length
            };
            
            const statsHTML = `
                <strong>📝 Total entries:</strong> ${total}<br>
                <strong>✅ Unique lessons:</strong> ${unique}<br>
                ${duplicates > 0 ? 
                    `<span class="warning">⚠️ Duplicates found: ${duplicates}</span>` : 
                    '<span class="success">✓ No duplicates!</span>'}
            `;
            document.getElementById('stats').innerHTML = statsHTML;
            
            // Module breakdown
            const moduleHTML = `
                <h3>By Module:</h3>
                <div class="module-item">📖 Reading: ${moduleCount.reading} (${[...new Set(parsedData.filter(l => l.startsWith('reading-')))].length} unique)</div>
                <div class="module-item">🎧 Listening: ${moduleCount.listening} (${[...new Set(parsedData.filter(l => l.startsWith('listening-')))].length} unique)</div>
                <div class="module-item">✍️ Writing: ${moduleCount.writing} (${[...new Set(parsedData.filter(l => l.startsWith('writing-')))].length} unique)</div>
                <div class="module-item">🗣️ Speaking: ${moduleCount.speaking} (${[...new Set(parsedData.filter(l => l.startsWith('speaking-')))].length} unique)</div>
            `;
            document.getElementById('moduleBreakdown').innerHTML = moduleHTML;
        }
        
        function removeDuplicates() {
            const completed = localStorage.getItem('completedLessons');
            const parsedData = completed ? JSON.parse(completed) : [];
            const unique = [...new Set(parsedData)];
            
            const removed = parsedData.length - unique.length;
            localStorage.setItem('completedLessons', JSON.stringify(unique));
            alert(`✓ Successfully removed ${removed} duplicate${removed !== 1 ? 's' : ''}!`);
            location.reload();
        }
        
        function clearStorage() {
            if (confirm('⚠️ Are you sure you want to clear ALL completed lessons? This cannot be undone!')) {
                localStorage.removeItem('completedLessons');
                alert('✓ All data cleared!');
                location.reload();
            }
        }
        
        // Display on load
        displayData();
    </script>
</body>
</html>
